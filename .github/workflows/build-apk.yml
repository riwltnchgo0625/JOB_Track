name: Build JOB_Track APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply v1.4 patch
        run: python3 tools/patch_v14.py
      - name: Apply v1.5 share import patch
        run: python3 tools/patch_v15.py
      - name: Apply v1.6 startup hotfix
        run: python3 tools/patch_v16.py
      - name: Validate embedded JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          match = re.search(r'<script>(.*)</script>', html, re.S)
          if not match:
              raise SystemExit('script tag not found')
          Path('/tmp/jobtrack-app.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/jobtrack-app.js
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: JOB_Track-v1.6-APK
          path: app/build/outputs/apk/debug/app-debug.apk
