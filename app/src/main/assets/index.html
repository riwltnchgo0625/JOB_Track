<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0b0f17"><style> :root{ color-scheme:dark; --bg:#0b0f17;--surface:#121a28;--surface2:#0f1622;--line:#263247; --text:#f4f7fb;--sub:#aab6c8;--accent:#91baff;--accentText:#071d3b; --danger:#ffb7b7;--radius:20px;--page:clamp(16px,4.5vw,28px); } *{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR","SamsungOne",sans-serif} body{font-size:clamp(15px,3.8vw,18px);line-height:1.55;overflow-x:hidden} button,input,textarea,select{font:inherit} button{cursor:pointer} .app-shell{width:min(100%,820px);margin:0 auto;min-height:100dvh} header{position:sticky;top:0;z-index:20;background:rgba(11,15,23,.94);backdrop-filter:blur(14px);padding:calc(18px + env(safe-area-inset-top)) var(--page) 15px;border-bottom:1px solid rgba(255,255,255,.06)} .header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.brand{font-size:clamp(23px,6vw,30px);font-weight:850;letter-spacing:-.03em}.sub{font-size:.78em;color:var(--sub);margin-top:2px}.settings-btn{width:44px;height:44px;min-height:44px;border-radius:14px;padding:0;background:#151e2d;color:#eaf1fb;border:1px solid #28364b;font-size:21px;flex:0 0 auto} .wrap{padding:18px var(--page) calc(118px + env(safe-area-inset-bottom));} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:10px;margin-bottom:18px} .box,.card{background:var(--surface);border:1px solid rgba(255,255,255,.035);border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,.12)} .box{padding:clamp(16px,4.8vw,22px)}.card{padding:clamp(16px,4.8vw,22px);margin:14px 0} .stat{min-height:92px;display:flex;flex-direction:column;justify-content:center}
.stat-clickable{cursor:pointer;transition:transform .12s ease,border-color .12s ease}.stat-clickable:active{transform:scale(.97)}.stat-clickable .muted:after{content:"  ›";color:#7faef7;font-weight:800}
.list-title{font-size:clamp(21px,5.5vw,27px);font-weight:850;letter-spacing:-.03em;margin:3px 0 14px}.search-wrap{position:relative;margin:0 0 16px}.search-input{width:100%;min-height:52px;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:16px;padding:13px 46px 13px 16px;outline:none}.search-input:focus{border-color:#6da4ff;box-shadow:0 0 0 3px rgba(109,164,255,.12)}.search-icon{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none}.list-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 2px 10px;color:var(--sub);font-size:.78em}.filter-label{background:#15243a;border:1px solid #294467;color:#cfe2ff;border-radius:999px;padding:5px 9px;white-space:nowrap}.company-list .card{margin:10px 0}.num{font-size:clamp(23px,6vw,30px);font-weight:850;line-height:1}.muted{color:var(--sub);font-size:.78em}.company{font-size:clamp(19px,5vw,23px);font-weight:850;letter-spacing:-.02em;overflow-wrap:anywhere} .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.grow{min-width:0;flex:1}.status{background:#173a67;color:#dcecff;padding:5px 9px;border-radius:999px;font-size:.72em;white-space:nowrap}.stars{color:#ffd978;margin-top:12px;letter-spacing:1px} .section{margin:30px 0}.section h3{font-size:clamp(17px,4.4vw,20px);line-height:1.35;margin:0 0 13px;font-weight:850;letter-spacing:-.02em}.text{white-space:pre-wrap;line-height:1.72;color:#e0e7f1;word-break:keep-all;overflow-wrap:anywhere} .summary-card{margin-top:16px}.scoreline{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}.pill{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:.75em;color:#dce5f3} .actions,.linkbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-top:14px}.actions.bottom{margin-top:34px;padding-bottom:12px} button,.btn{border:0;border-radius:14px;padding:13px 15px;font-weight:800;min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;background:var(--accent);color:var(--accentText)} .secondary{background:#1b2535;color:#eef4ff;border:1px solid #2a374c}.danger{background:#332126;color:var(--danger);border:1px solid #57333b}.icon-btn{gap:7px} .form-card{padding:18px;margin:16px 0}.field{margin:0 0 18px}.field label{display:block;font-size:.78em;color:var(--sub);margin:0 0 7px;font-weight:700}.field input,.field textarea,.field select{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:13px 14px;outline:none}.field textarea{min-height:112px;resize:vertical;line-height:1.6}.field input:focus,.field textarea:focus,.field select:focus{border-color:#6da4ff;box-shadow:0 0 0 3px rgba(109,164,255,.12)} .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar button{flex:1 1 130px}.empty{padding:36px 18px;text-align:center;color:var(--sub)} .fab{position:fixed;z-index:30;right:max(20px,calc((100vw - 820px)/2 + 20px));bottom:calc(22px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;padding:0;font-size:28px;box-shadow:0 12px 30px rgba(0,0,0,.35)}.hidden{display:none!important} .home-card{transition:transform .12s ease}.home-card:active{transform:scale(.985)} .url-hint{font-size:.72em;color:var(--sub);overflow-wrap:anywhere;margin-top:7px} @media (max-width:390px){ :root{--page:16px;--radius:18px}.wrap{padding-top:14px}.card,.box{padding:16px}.section{margin:26px 0}.row{gap:8px}.status{font-size:.68em} } @media (min-width:700px){ .wrap{padding-top:24px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}.detail-grid .section{margin:0}.detail-grid .wide{grid-column:1/-1} } @media (orientation:landscape) and (max-height:520px){header{position:relative}.wrap{padding-bottom:90px}.fab{bottom:16px}} </style></head><body><div class="app-shell"><header><div class="header-row"><div><div class="brand">이직로그</div><div class="sub">기업 분석과 지원 현황</div></div><button class="settings-btn" onclick="dataPage()" aria-label="데이터 관리">⚙</button></div></header><main id="app" class="wrap"></main></div><button id="fab" class="fab" onclick="form()" aria-label="기업 추가">＋</button><script> const K='jobtrack-v1'; const sample={ id:'codit',company:'코딧 (CODIT)',position:'QA / SQA',industry:'AI SaaS · RegTech',status:'지원 검토',interest:4,fitScore:90, website:'https://thecodit.com/',careersUrl:'https://codit.career.rivers.co.kr/', summary:'AI 기반 법률·규제·정책 데이터를 분석하는 B2B SaaS 기업.', business:'B2B SaaS · ChatCODIT · B2G 규제 서비스 · 글로벌 정책 데이터', finance:'2023 매출 약 6억 원\n2024 매출 약 7.2억 / 영업손실 약 9.2억\n2025 매출 약 20.4억 / 영업이익 약 2억', competitors:'FiscalNote, Quorum 대비 국내 정책 데이터와 RegTech 초기 선점이 강점', issues:'ChatCODIT 출시 · AI Policy Agent 강화 · B2G 확대 · 글로벌 데이터 확대', jd:'Frontend/Backend QA · 요구사항 분석 · Test Plan · TC · Jira · QA 프로세스 개선 · Python · 생성형 AI', motivation:'1. AI 챗봇 검증 경험 연결\n2. 품질 기준 정의 경험 강조\n3. 법·규제 AI의 정확성과 신뢰성 관점', memo:'지원 전 QA팀 인원, 자동화 수준, 연봉, 업무강도 확인' }; let a=JSON.parse(localStorage.getItem(K)||'null')||[sample]; for(const c of a){if(c.id==='codit'){c.website=c.website||sample.website;c.careersUrl=c.careersUrl||sample.careersUrl}} function save(){localStorage.setItem(K,JSON.stringify(a))}save(); const app=document.getElementById('app'),fab=document.getElementById('fab');
let currentRoute={view:'home'};
function setRoute(state,skipHistory=false){currentRoute=state;if(!skipHistory)history.pushState(state,'')}
function renderRoute(state){state=state||{view:'home'};if(state.view==='list')return listPage(state.filter||'all',state.query||'',true);if(state.view==='detail')return detail(state.id,true);if(state.view==='form')return form(state.id||'',true);if(state.view==='data')return dataPage(true);return home(true)}
window.addEventListener('popstate',ev=>renderRoute(ev.state||{view:'home'}));
window.handleAndroidBack=function(){if((currentRoute&&currentRoute.view)!=='home'){history.back();return true}return false}; function e(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} function safeUrl(u=''){u=String(u).trim();return /^https?:\/\//i.test(u)?u:''} function stars(n){n=Math.max(0,Math.min(5,+n||0));return '★'.repeat(n)+'☆'.repeat(5-n)} function go(url){url=safeUrl(url);if(url)location.href=url} function home(skipHistory=false){ setRoute({view:'home'},skipHistory); fab.classList.remove('hidden'); const planned=a.filter(x=>['지원 예정','지원 검토'].includes(x.status)).length; const interview=a.filter(x=>x.status==='면접').length; app.innerHTML=`<div class="grid"><div class="box stat stat-clickable" role="button" tabindex="0" onclick="listPage('all')"><div class="num">${a.length}</div><div class="muted">저장 기업</div></div><div class="box stat stat-clickable" role="button" tabindex="0" onclick="listPage('planned')"><div class="num">${planned}</div><div class="muted">지원 예정</div></div><div class="box stat stat-clickable" role="button" tabindex="0" onclick="listPage('interview')"><div class="num">${interview}</div><div class="muted">면접</div></div></div><div class="section"><h3>이직 현황</h3><div class="box text">저장 기업을 눌러 기업 목록을 열고, 검색해서 원하는 기업의 분석 내용을 확인할 수 있습니다.</div></div>`; window.scrollTo(0,0) }
function filterCompanies(filter){ if(filter==='planned') return a.filter(x=>['지원 예정','지원 검토'].includes(x.status)); if(filter==='interview') return a.filter(x=>x.status==='면접'); return a.slice(); }
function filterName(filter){ if(filter==='planned') return '지원 예정'; if(filter==='interview') return '면접'; return '전체'; }
function companyListHtml(filter,query=''){ const q=String(query||'').trim().toLowerCase(); let list=filterCompanies(filter); if(q) list=list.filter(c=>[c.company,c.position,c.industry,c.status].some(v=>String(v||'').toLowerCase().includes(q))); const cards=list.map(c=>`<div class="card home-card" onclick="detail('${e(c.id)}')"><div class="row"><div class="grow"><div class="company">${e(c.company)}</div><div class="muted">${e(c.position)} · ${e(c.industry)}</div></div><span class="status">${e(c.status)}</span></div><div class="stars">${stars(c.interest||3)}</div><div class="muted">적합도 ${+c.fitScore||0}%</div></div>`).join(''); return `<div class="list-meta"><span>${list.length}개 기업</span><span class="filter-label">${filterName(filter)}</span></div><div class="company-list">${cards||`<div class="box empty">검색 조건에 맞는 기업이 없습니다.</div>`}</div>`; }
function updateListSearch(value){ const filter=(currentRoute&&currentRoute.filter)||'all'; currentRoute={view:'list',filter,query:value}; history.replaceState(currentRoute,''); const target=document.getElementById('companyListArea'); if(target) target.innerHTML=companyListHtml(filter,value); }
function listPage(filter='all',query='',skipHistory=false){ setRoute({view:'list',filter,query},skipHistory); fab.classList.remove('hidden'); app.innerHTML=`<div class="toolbar"><button class="secondary" onclick="history.back()">← 홈</button></div><div class="list-title">기업 목록</div><div class="search-wrap"><input id="companySearch" class="search-input" type="search" value="${e(query)}" placeholder="기업명, 직무, 산업 검색" oninput="updateListSearch(this.value)" autocomplete="off"><span class="search-icon">⌕</span></div><div id="companyListArea">${companyListHtml(filter,query)}</div>`; window.scrollTo(0,0); const input=document.getElementById('companySearch'); if(input&&query) setTimeout(()=>{input.setSelectionRange(input.value.length,input.value.length)},0); }
function dataPage(skipHistory=false){ setRoute({view:'data'},skipHistory); fab.classList.add('hidden'); app.innerHTML=`<div class="toolbar"><button class="secondary" onclick="history.back()">← 홈으로</button></div><div class="section"><h3>데이터 관리</h3><div class="box text">기업 분석 데이터를 다른 기기에서 가져오거나 백업할 때만 사용합니다. 평소에는 사용할 필요가 없습니다.</div></div><div class="actions"><button class="secondary" onclick="importJ()">데이터 가져오기</button><button class="secondary" onclick="exportJ()">데이터 백업 복사</button></div>`; window.scrollTo(0,0) } function detail(id,skipHistory=false){ const c=a.find(x=>x.id===id);if(!c){history.replaceState({view:'home'},'');return home(true)}setRoute({view:'detail',id},skipHistory);fab.classList.add('hidden'); const links=[]; if(safeUrl(c.website))links.push(`<button class="secondary icon-btn" onclick="go('${e(c.website)}')">↗ 기업 홈페이지</button>`); if(safeUrl(c.careersUrl))links.push(`<button class="secondary icon-btn" onclick="go('${e(c.careersUrl)}')">↗ 채용 페이지</button>`); const sections=[['기업 요약','summary','wide'],['1. 주요 사업 구조와 매출 비중','business',''],['2. 최근 3년 재무','finance',''],['3. 경쟁사와 시장 위치','competitors',''],['4. 최근 6개월 이슈 및 전략','issues',''],['5. JD 핵심 키워드','jd',''],['6. 지원동기 활용 포인트','motivation',''],['내 메모','memo','wide']]; app.innerHTML=`<div class="toolbar"><button class="secondary" onclick="history.back()">← 목록</button></div><div class="card summary-card"><div class="row"><div class="grow"><div class="company">${e(c.company)}</div><div class="muted">${e(c.position)} · ${e(c.industry)}</div></div><span class="status">${e(c.status)}</span></div><div class="scoreline"><span class="pill">관심도 ${stars(c.interest||3)}</span><span class="pill">적합도 ${+c.fitScore||0}%</span></div>${links.length?`<div class="linkbar">${links.join('')}</div>`:''}</div><div class="detail-grid">${sections.map(([t,k,w])=>`<section class="section ${w}"><h3>${t}</h3><div class="box text">${e(c[k]||'')}</div></section>`).join('')}</div><div class="actions bottom"><button onclick="form('${e(id)}')">수정</button><button class="danger" onclick="del('${e(id)}')">삭제</button></div>`; window.scrollTo(0,0) } const fieldDefs=[ ['company','기업명','text'],['position','지원 직무','text'],['industry','산업/분야','text'],['status','지원 상태','status'],['interest','관심도 (1~5)','number'],['fitScore','직무 적합도 (0~100)','number'],['website','기업 홈페이지 URL','url'],['careersUrl','채용 페이지 URL','url'],['summary','기업 요약','textarea'],['business','1. 주요 사업 구조와 매출 비중','textarea'],['finance','2. 최근 3년 재무','textarea'],['competitors','3. 경쟁사와 시장 위치','textarea'],['issues','4. 최근 6개월 이슈 및 전략','textarea'],['jd','5. JD 핵심 키워드','textarea'],['motivation','6. 지원동기 활용 포인트','textarea'],['memo','내 메모','textarea'] ]; function form(id='',skipHistory=false){ setRoute({view:'form',id},skipHistory); fab.classList.add('hidden');const c=a.find(x=>x.id===id)||{id:'id'+Date.now(),position:'QA / SQA',status:'관심',interest:3,fitScore:0}; const controls=fieldDefs.map(([k,label,type])=>{let v=e(c[k]??'');if(type==='textarea')return `<div class="field"><label>${label}</label><textarea name="${k}">${v}</textarea></div>`;if(type==='status'){let opts=['관심','지원 검토','지원 예정','지원 완료','서류 합격','면접','최종 합격','불합격'].map(s=>`<option ${c[k]===s?'selected':''}>${s}</option>`).join('');return `<div class="field"><label>${label}</label><select name="${k}">${opts}</select></div>`}let attrs=type==='number'?(k==='interest'?'min="1" max="5"':'min="0" max="100"'):'';return `<div class="field"><label>${label}</label><input type="${type}" ${attrs} name="${k}" value="${v}" placeholder="${type==='url'?'https://':''}"></div>`}).join(''); app.innerHTML=`<div class="toolbar"><button class="secondary" type="button" onclick="history.back()">← 돌아가기</button></div><form class="box form-card" onsubmit="submitF(event,'${e(c.id)}')">${controls}<div class="actions"><button type="submit">저장</button></div></form>`;window.scrollTo(0,0) } function submitF(ev,id){ev.preventDefault();let d=Object.fromEntries(new FormData(ev.target).entries());d.id=id;d.interest=Math.max(1,Math.min(5,+d.interest||3));d.fitScore=Math.max(0,Math.min(100,+d.fitScore||0));let i=a.findIndex(x=>x.id===id);i<0?a.unshift(d):a[i]=d;save();history.replaceState({view:'detail',id},'');detail(id,true)} function del(id){if(confirm('이 기업을 삭제할까요?')){a=a.filter(x=>x.id!==id);save();history.back()}} function importJ(){let t=prompt('기업 분석 데이터를 붙여넣으세요.');if(!t)return;try{let x=JSON.parse(t);const list=Array.isArray(x)?x:[x];for(let item of list.reverse()){item.id=item.id||'id'+Date.now()+Math.random().toString(16).slice(2);a.unshift(item)}save();alert('가져오기가 완료되었습니다.');dataPage(true)}catch(_){alert('데이터 형식을 확인하세요.')}} function exportJ(){const txt=JSON.stringify(a,null,2);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>alert('기업 데이터 백업을 복사했습니다.')).catch(()=>prompt('아래 내용을 복사하세요.',txt))}else prompt('아래 내용을 복사하세요.',txt)} history.replaceState({view:'home'},'');home(true); </script></body></html>
